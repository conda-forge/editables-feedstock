{% set name = "editables" %}
{% set version = "0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/editables-{{ version }}.tar.gz
  sha256: 1163834902381c4613787951c5914800fdf155ae08848a373b8ea5006780977c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.3
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - editables
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pfmoore/editables
  summary: Editable installations
  dev_url: https://github.com/pfmoore/editables
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - xylar
    - ofek
